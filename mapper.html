<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id='main-page'>Plasmid Mapper</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/sidebar.css">

</head>

<body>
    <main role="main" class="container-fluid">

        <p class="h1 text-center text-dark mt-3">Plasmid Viewer</p>
        <hr>

        <div class="app-layout">
            <!-- Sidebar: every control card from the old 3-per-row grid,
                 restacked vertically as collapsible sections so the figure
                 gets the full remaining width instead of sharing it with a
                 tall block of cards above it. -->
            <aside class="app-sidebar">
                <div class="accordion" id="sidebar-accordion">

                    <!-- Query section: pick a plasmid and render it. Nothing else lives here. -->
                    <div class="card">
                        <div class="card-header" id="heading-query" data-toggle="collapse" data-target="#collapse-query" aria-expanded="true">
                            Query
                            <i class="fa fa-question-circle text-muted ml-1" data-toggle="tooltip" data-placement="top"
                                title="Choose a plasmid generated by plasmid-mapper-gen (or hand-added to ref_data.js), then Update to render it."></i>
                        </div>
                        <div id="collapse-query" class="collapse show" data-parent="#sidebar-accordion">
                            <div class="card-body">
                                <div class="input-group mb-2">
                                    <div class="input-group-prepend">
                                        <label class="input-group-text" for="qryselect">Query. ID</label>
                                    </div>
                                    <select class="custom-select" id="qryselect">
                                      <option selected>Choose...</option>
                                    </select>
                                </div>
                                <button id='uptBtn' type="button" class="btn btn-info btn-block">Update</button>
                            </div>
                        </div>
                    </div>

                    <!-- Settings section: figure geometry controls. -->
                    <div class="card">
                        <div class="card-header" id="heading-settings" data-toggle="collapse" data-target="#collapse-settings" aria-expanded="true">
                            Settings
                            <i class="fa fa-question-circle text-muted ml-1" data-toggle="tooltip" data-placement="top"
                                title="Adjust the overall figure size and how the comparison rings are drawn. Changes apply immediately."></i>
                        </div>
                        <div id="collapse-settings" class="collapse show" data-parent="#sidebar-accordion">
                            <div class="card-body">
                                <div class="form-group row mb-2">
                                    <label class="col-6 col-form-label col-form-label-sm" for="radius-inpt">Diameter</label>
                                    <div class="col-6">
                                        <input type="number" class="form-control form-control-sm setting-inpt" id="radius-inpt" value="260" min="50" max="1000" step="10">
                                    </div>
                                </div>
                                <div class="form-group row mb-2">
                                    <label class="col-6 col-form-label col-form-label-sm" for="ring-thickness-inpt">Ring thickness</label>
                                    <div class="col-6">
                                        <input type="number" class="form-control form-control-sm setting-inpt" id="ring-thickness-inpt" value="4" min="1" max="50" step="1">
                                    </div>
                                </div>
                                <div class="form-group row mb-2">
                                    <label class="col-6 col-form-label col-form-label-sm" for="ring-spacing-inpt">Ring spacing</label>
                                    <div class="col-6">
                                        <input type="number" class="form-control form-control-sm setting-inpt" id="ring-spacing-inpt" value="-5" min="-50" max="-1" step="1">
                                    </div>
                                </div>
                                <div class="form-group row mb-2">
                                    <label class="col-6 col-form-label col-form-label-sm" for="orf-legend-style-select">ORF legend</label>
                                    <div class="col-6">
                                        <select class="custom-select custom-select-sm setting-inpt" id="orf-legend-style-select">
                                            <option value="curved" selected>Curved</option>
                                            <option value="rect">Boxed</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group row mb-0">
                                    <label class="col-6 col-form-label col-form-label-sm" for="blast-legend-style-select">BLAST legend</label>
                                    <div class="col-6">
                                        <select class="custom-select custom-select-sm setting-inpt" id="blast-legend-style-select">
                                            <option value="curved" selected>Curved</option>
                                            <option value="rect">Boxed</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Style section: opens the font/color customization modal (js/pl_style_modal.js). -->
                    <div class="card">
                        <div class="card-header" id="heading-style" data-toggle="collapse" data-target="#collapse-style" aria-expanded="true">
                            Style
                            <i class="fa fa-question-circle text-muted ml-1" data-toggle="tooltip" data-placement="top"
                                title="Customize the font and color used for each text/ORF element in the figure."></i>
                        </div>
                        <div id="collapse-style" class="collapse show" data-parent="#sidebar-accordion">
                            <div class="card-body">
                                <button id="openStyleModalBtn" type="button" class="btn btn-sm btn-outline-primary btn-block">Customize…</button>
                            </div>
                        </div>
                    </div>

                    <!-- Export section: rendered-image export, kept separate from the edits-file import/export below. -->
                    <div class="card">
                        <div class="card-header" id="heading-export" data-toggle="collapse" data-target="#collapse-export" aria-expanded="true">
                            Export image
                            <i class="fa fa-question-circle text-muted ml-1" data-toggle="tooltip" data-placement="top"
                                title="Save the current figure as an image. SVG is vector (best for publication figures and further editing); PNG/JPEG are rasterized at the pixel size below."></i>
                        </div>
                        <div id="collapse-export" class="collapse show" data-parent="#sidebar-accordion">
                            <div class="card-body">
                                <div class="form-group row mb-2">
                                    <label class="col-6 col-form-label col-form-label-sm">Width x Height</label>
                                    <div class="col-6 d-flex">
                                        <input type="text" class="form-control form-control-sm inpt mr-1" id="width-inpt" placeholder="Width" aria-label="Width" value="5000">
                                        <input type="text" class="form-control form-control-sm inpt" placeholder="Height" id="height-inpt" aria-label="Height" value="5000">
                                    </div>
                                </div>
                                <div class="form-group row mb-0">
                                    <label class="col-6 col-form-label col-form-label-sm">Format</label>
                                    <div class="col-6 d-flex">
                                        <select class="custom-select custom-select-sm mr-1" id="export-format-select">
                                            <option value="svg" selected>SVG</option>
                                            <option value="png">PNG</option>
                                            <option value="jpeg">JPEG</option>
                                        </select>
                                        <button id='genBtn' type="button" class="btn btn-sm btn-secondary">Export</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Bands section: interactively zoom into a region of the query ring. -->
                    <div class="card">
                        <div class="card-header" id="heading-bands" data-toggle="collapse" data-target="#collapse-bands" aria-expanded="true">
                            Zoom bands
                            <i class="fa fa-question-circle text-muted ml-1" data-toggle="tooltip" data-placement="top"
                                title="Click 'Add band', then click-and-drag on the query ring to magnify that region into a second, zoomed-in ring. Each band can be removed with its x button."></i>
                        </div>
                        <div id="collapse-bands" class="collapse show" data-parent="#sidebar-accordion">
                            <div class="card-body" id="annotation-controls-mount">
                                <!-- renderAnnotationControls() (js/pl_editor.js) populates this -->
                            </div>
                        </div>
                    </div>

                    <!-- Labels section: freeform + permanent ORF labels. -->
                    <div class="card">
                        <div class="card-header" id="heading-labels" data-toggle="collapse" data-target="#collapse-labels" aria-expanded="true">
                            Labels
                            <i class="fa fa-question-circle text-muted ml-1" data-toggle="tooltip" data-placement="top"
                                title="Hover any ORF to see its details. Click an ORF inside a zoom band to show/hide a permanent short label. 'Add label' lets you click anywhere on the figure to place a custom note."></i>
                        </div>
                        <div id="collapse-labels" class="collapse show" data-parent="#sidebar-accordion">
                            <div class="card-body">
                                <button id="addLabelBtn" type="button" class="btn btn-sm btn-outline-primary">Add label</button>
                            </div>
                        </div>
                    </div>

                    <!-- Edits import/export: figure-annotation edits (bands, labels), a
                         distinct concept from Export image above -- kept in its own
                         section per explicit request. -->
                    <div class="card">
                        <div class="card-header" id="heading-figedits" data-toggle="collapse" data-target="#collapse-figedits" aria-expanded="true">
                            Figure edits
                            <i class="fa fa-question-circle text-muted ml-1" data-toggle="tooltip" data-placement="top"
                                title="Your zoom bands and label edits are saved in this browser automatically. Export them to a file to back them up or move them to another browser/machine; Import restores them."></i>
                        </div>
                        <div id="collapse-figedits" class="collapse show" data-parent="#sidebar-accordion">
                            <div class="card-body">
                                <button id="exportEditsBtn" type="button" class="btn btn-sm btn-outline-secondary mr-2">Export edits</button>
                                <label class="btn btn-sm btn-outline-secondary mb-0" for="importEditsInput">
                                    Import edits
                                    <input type="file" id="importEditsInput" accept="application/json" style="display:none;">
                                </label>
                            </div>
                        </div>
                    </div>

                </div>
            </aside>

            <!-- Main column: figure + results table. -->
            <div class="app-main">
                <section id="main-section">
                    <svg id='main-svg'></svg>
                    <canvas id="canvas" width="5000" height="5000" style="display: none;"></canvas>
                </section>

                <div class="table-wrapper-scroll-y my-custom-scrollbar">
                    <table id='tbl-main' class="table table-bordered table-striped table-sm"></table>
                </div>
            </div>
        </div>

    </main>

    <!-- Style modal: font-family/size per text element, color per ORF
         category + band highlight. Built/populated by js/pl_style_modal.js;
         markup lives here since Bootstrap modals must be direct children
         of <body> (or close to it) to layer/position correctly. -->
    <div class="modal fade" id="styleModal" tabindex="-1" role="dialog" aria-labelledby="styleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="styleModalLabel">Figure style</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <h6>Text</h6>
                    <div id="style-modal-fonts"></div>
                    <hr>
                    <h6>ORF category colors</h6>
                    <div id="style-modal-colors" class="d-flex flex-wrap"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="button" id="applyStyleModalBtn" class="btn btn-primary">Apply</button>
                </div>
            </div>
        </div>
    </div>

</body>


<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
<script src="https://d3js.org/d3.v6.min.js"></script>
<script src="js/mustache.js"></script>
<script src="js/templates.js"></script>
<script src="js/pl_data.js"></script>
<script src="js/ref_data.js"></script>
<script src="js/inline_style.js"></script>
<script src="js/FileSaver.js"></script>
<script src="js/pl_editor.js"></script>
<script src="js/pl_mapper.js"></script>
<script src="js/pl_style_modal.js"></script>
<script>
    $(function () { $('[data-toggle="tooltip"]').tooltip(); });
</script>


</html>
