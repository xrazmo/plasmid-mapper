<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id='main-page'>Plasmid Mapper</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>
    <main role="main" class="container-fluid">

        <section class="container mt-4">
            <p class="h1 text-center text-dark">Plasmid Viewer</p>
            <hr>
            <div class="row">
                <div class="col-6">
                    <form class="form">
                        <div class="input-group mb-3">
                            <div class="input-group-prepend">
                                <label class="input-group-text" for="qryselect">Query. ID</label>
                            </div>
                            <select class="custom-select" id="qryselect">
                              <option selected>Choose...</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="col-6">
                    <button id='uptBtn' type="button" class="btn btn-info">Update</button>
                    <button id='svBtn' type="button" class="btn btn-secondary">Save</button>
                </div>

            </div>
            <div class="row">
                <div class="table-wrapper-scroll-y my-custom-scrollbar ">
                    <table id='tbl-main' class="table table-bordered table-striped table-sm"></table>
                </div>
            </div>
        </section>

        <section id="main-section" class="mt-5">
            <svg id='main-svg'></svg>
        </section>

    </main>


</body>


<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
<script src="https://d3js.org/d3.v6.min.js"></script>
<script src="js/mustache.js"></script>
<script src="js/templates.js"></script>
<script src="js/pl_data.js"></script>
<script src="js/ref_data.js"></script>
<script src="js/pl_mapper.js"></script>


</html>
