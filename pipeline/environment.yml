name: plasmid-mapper
channels:
  - bioconda
  - conda-forge
dependencies:
  - python>=3.10
  - prokka>=1.14.6  # older prokka (e.g. 1.13) misparses modern blastp version strings (e.g. "2.17") as too old
  - blast>=2.12
  - diamond>=2.1  # used automatically for protein-vs-protein DB searches (CARD/VFDB/BacMet/UniProt) when present; ISfinder always uses BLAST+'s tblastn regardless
  - biopython>=1.79
  - pyyaml>=6.0
  - nodejs>=20  # build-time only, for esbuild (--single-html output): minifies the tool's own JS into the generated HTML. Never required to open/use that HTML file itself.
  - pip
  - pip:
      - -e .
