<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id='main-page'>KPC-33 Plasmid Viewer</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="./style.css">

</head>

<body>
    <main role="main" class="container-fluid">

        <section class="container mt-4">
            <p class="h1 text-center text-dark">KPC-33 Plasmid Viewer</p>
            <p class="text-center text-muted">Generated by plasmid-mapper-gen: KPC33_p1 (26ET500373, 67,418 bp IncN plasmid) vs. CP104943.1 (pKP38941-KPC2) and CP104950.1 (pEC32446-KPC2)</p>
            <hr>
            <div class="row">
                <div class="col-5">
                    <form class="form">
                        <div class="input-group mb-3">
                            <div class="input-group-prepend">
                                <label class="input-group-text" for="qryselect">Query. ID</label>
                            </div>
                            <select class="custom-select" id="qryselect">
                              <option selected>Choose...</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="col-1">
                    <button id='uptBtn' type="button" class="btn btn-info">Update</button>

                </div>
                <div class="col-5">
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text">Width</span>
                        </div>
                        <input type="text" class="form-control inpt" id="width-inpt" placeholder="Width" aria-label="Width" value="5000">
                        <div class="input-group-prepend">
                            <span class="input-group-text">Height</span>
                        </div>
                        <input type="text" class="form-control inpt" placeholder="Height" id="height-inpt" aria-label="Height" value="5000">
                        <button id='genBtn' type="button" class="btn btn-secondary ml-2">Save png</button>
                    </div>


                </div>

            </div>
            <div class="row mt-2">
                <div class="col-12">
                    <button id="addLabelBtn" type="button" class="btn btn-sm btn-outline-primary mr-2">Add label</button>
                    <button id="exportEditsBtn" type="button" class="btn btn-sm btn-outline-secondary mr-2">Export edits</button>
                    <label class="btn btn-sm btn-outline-secondary mb-0" for="importEditsInput">
                        Import edits
                        <input type="file" id="importEditsInput" accept="application/json" style="display:none;">
                    </label>
                </div>
            </div>
            <div class="row">
                <div class="col-12 table-wrapper-scroll-y my-custom-scrollbar ">
                    <table id='tbl-main' class="table table-bordered table-striped table-sm"></table>
                </div>
            </div>
        </section>

        <section id="main-section">
            <svg id='main-svg'></svg>
            <canvas id="canvas" width="5000" height="5000" style="display: none;"></canvas>

        </section>

    </main>


</body>


<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
<script src="https://d3js.org/d3.v6.min.js"></script>
<script src="js/kpc33_comparisons.js"></script>
<script src="js/kpc33_orfs.js"></script>
<script src="../../js/inline_style.js"></script>
<script src="../../js/FileSaver.js"></script>
<script src="../../js/pl_editor.js"></script>
<script src="../../js/pl_mapper.js"></script>


</html>
